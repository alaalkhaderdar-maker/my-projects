<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة مشاريع الأحلام</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 10px; min-height: 100vh; }
        .dashboard-container { max-width: 100%; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 20px; }
        .main-header-title { width: 100%; text-align: center; font-size: 2rem; font-weight: 700; color: #1a365d; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 3px solid #e2e8f0; }
        .counters-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; width: 100%; }
        .counter-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; text-align: center; }
        .counter-card h3 { font-size: 0.85rem; color: #64748b; margin-bottom: 8px; font-weight: 600; }
        .counter-value { font-size: 1.4rem; font-weight: 700; color: #0f172a; border: none; background: transparent; text-align: center; width: 100%; outline: none; border-bottom: 1px dashed #cbd5e1; }
        .utility-bar { width: 100%; display: flex; flex-direction: column; gap: 15px; background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
        .backup-controls { display: flex; gap: 10px; align-items: center; justify-content: flex-start; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: background 0.2s; }
        .btn-download { background: #10b981; color: white; }
        .btn-upload { background: #3b82f6; color: white; position: relative; }
        .btn-upload input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .global-progress-container { width: 100%; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .progress-bar-bg { width: 100%; height: 12px; background: #cbd5e1; border-radius: 9999px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #10b981); transition: width 0.4s ease; }
        
        .project-form { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; background: #fff; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; }
        .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; }
        .form-input, .form-select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; }
        .btn-submit { background: #1e293b; color: white; padding: 12px; font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; text-align: center; border: none; width: 100%; }
        .btn-submit:hover { background: #0f172a; }
        
        .grid-paper-container { width: 100%; background-color: #fff; background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px); background-size: 25px 25px; border: 2px solid #cbd5e1; border-radius: 8px; padding: 20px 0; min-height: 450px; display: flex; flex-direction: column; gap: 5px; }
        .category-section { width: 100%; display: none; }
        .project-card { width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 12px 25px; margin-bottom: 2px; position: relative; box-shadow: inset 0 -1px 0 rgba(0,0,0,0.1); }
        
        .card-dream { background-color: rgba(0, 162, 232, 0.85); color: #000; }
        .card-active { background-color: rgba(163, 73, 164, 0.85); color: #000; }
        .card-completed { background-color: rgba(34, 177, 76, 0.85); color: #000; }
        
        .card-main-info { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .project-title-text { font-size: 1.2rem; font-weight: 700; color: #000; }
        .card-meta-details { display: flex; gap: 25px; font-size: 0.9rem; color: #111; font-weight: 600; }
        .card-actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
        .btn-card-action { padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; border: 1px solid rgba(0,0,0,0.2); cursor: pointer; font-weight: 600; }
        .btn-delete { background: rgba(254, 226, 226, 0.9); color: #b91c1c; }
        .btn-status-shift { background: rgba(255, 255, 255, 0.9); color: #1e293b; }
        
        @media (max-width: 768px) { .counters-row, .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1 class="main-header-title">📊 لوحة عمل وتخطيط مشاريع الأحلام</h1>
        
        <div class="counters-row">
            <div class="counter-card"><h3>📁 عدد المشاريع</h3><input class="counter-value" id="count-projects" type="number" value="0"/></div>
            <div class="counter-card"><h3>👥 عدد المشتركين</h3><input class="counter-value" id="count-subs" type="number" value="0"/></div>
            <div class="counter-card"><h3>💰 المال المتوفر (دينار أردني)</h3><input class="counter-value" id="count-funds" type="number" value="0"/></div>
            <div class="counter-card"><h3>📈 الأرباح المحققة (دينار أردني)</h3><input class="counter-value" id="count-profits" type="number" value="0"/></div>
        </div>
        
        <div class="utility-bar">
            <div class="backup-controls">
                <button class="btn btn-download" id="btn-export-dash">📥 تحميل نسخة احتياطية</button>
                <button class="btn btn-upload">📤 رفع نسخة احتياطية<input accept=".json" id="importFile" type="file"/></button>
            </div>
            <div class="global-progress-container">
                <div class="progress-label"><span>⚡ مؤشر تحويل الأحلام إلى واقع</span><span id="progress-percentage">0%</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
            </div>
        </div>
        
        <div class="project-form">
            <div class="form-row">
                <input class="form-input" id="proj-title" placeholder="اكتب فكرة مشروعك هنا..." type="text"/>
                <input class="form-input" id="proj-budget" placeholder="الميزانية (دينار أردني)" type="number"/>
                <input class="form-input" id="proj-deadline" type="date"/>
                <select class="form-select" id="proj-category">
                    <option value="dream">💭 مشروع حلم (بلوك أزرق)</option>
                    <option value="active">🚀 مشروع نشط (بلوك بنفسجي)</option>
                    <option value="completed">✅ مشروع مكتمل (بلوك أخضر)</option>
                </select>
            </div>
            <button class="btn-submit" id="btn-add-dash">➕ إضافة المشروع للورقة</button>
        </div>
        
        <div class="grid-paper-container">
            <div class="category-section" id="sec-dream"><div id="list-dream"></div></div>
            <div class="category-section" id="sec-active"><div id="list-active"></div></div>
            <div class="category-section" id="sec-completed"><div id="list-completed"></div></div>
        </div>
    </div>

    <script type="text/javascript">
        let projects = [];

        function initDash() {
            if(localStorage.getItem('dream_dash_projects')) {
                projects = JSON.parse(localStorage.getItem('dream_dash_projects'));
            }
            
            const fields = ['count-projects', 'count-subs', 'count-funds', 'count-profits'];
            fields.forEach(f => {
                const el = document.getElementById(f);
                if(el) {
                    if(localStorage.getItem('counter_' + f.replace('count-', ''))) {
                        el.value = localStorage.getItem('counter_' + f.replace('count-', ''));
                    }
                    el.addEventListener('input', saveCounters);
                }
            });

            document.getElementById('btn-add-dash').addEventListener('click', addProject);
            document.getElementById('btn-export-dash').addEventListener('click', exportProjects);
            document.getElementById('importFile').addEventListener('change', importProjects);

            renderProjects();
        }

        function saveCounters() {
            localStorage.setItem('counter_projects', document.getElementById('count-projects').value);
            localStorage.setItem('counter_subs', document.getElementById('count-subs').value);
            localStorage.setItem('counter_funds', document.getElementById('count-funds').value);
            localStorage.setItem('counter_profits', document.getElementById('count-profits').value);
        }

        function addProject() {
            const title = document.getElementById('proj-title').value.trim();
            const budget = document.getElementById('proj-budget').value.trim();
            const deadline = document.getElementById('proj-deadline').value;
            const category = document.getElementById('proj-category').value;
            
            if(!title) {
                alert('الرجاء كتابة عنوان المشروع أولاً!');
                return;
            }
            
            projects.push({ id: Date.now(), title, budget: budget || 'غير محدد', deadline: deadline || 'غير محدد', category });
            localStorage.setItem('dream_dash_projects', JSON.stringify(projects));
            renderProjects();
            
            document.getElementById('proj-title').value = ''; 
            document.getElementById('proj-budget').value = '';
